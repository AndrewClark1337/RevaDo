
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Create Task - RevaDo</title>
	<link rel="stylesheet" href="createTasks.css" />
</head>
<body>
	<div class="container">
		<h1>Create Task</h1>
		<form id="create-task-form">
			<label for="title">Title</label>
			<input id="title" name="title" type="text" required />

			<label for="description">Description</label>
			<textarea id="description" name="description" rows="4"></textarea>

			<label for="due">Due date</label>
			<input id="due" name="due" type="date" />

			<label for="priority">Priority</label>
			<select id="priority" name="priority">
				<option value="5">Negligible</option>
                <option value="4">Low</option>
				<option value="3" selected>Medium</option>
                <option value="2">High</option>
				<option value="1">Critical</option>
			</select>

			<button type="submit" action="createTask" >Create</button>
		</form>
		<div class="message" id="message" role="status" aria-live="polite"></div>
	</div>
    <script src="createTasks.ts"></script>
</body>
</html>
