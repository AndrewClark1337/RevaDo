<!DOCTYPE html>
<html>
    <head>
        <script src="./register.ts"></script>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <header>
            Register New User:
        </header>
        <section>
            <form> 
                <label>Username: <input id="uname" type="text" required ></label>
                <label>Email: <input id="email" type="text" required></label>
                <label>Password: <input id="pass" type="password" required></label>
                <label>Confirm Password: <input id="confirmPass" type="password" required></label>
                <br>
                <h6>Optional information:</h6>
                <br>
                <label>First Name: <input id="fname"  type="text"></label>
                <label>Last Name: <input id="lname" type="text"></label>
                <label>Phone Number: <input id="phone" type="text"></label>
                <label>Date of Birth: <input id="dob" type="date"></label>

                <button type="submit" action="login"> Register </button>

            </form>
            
        </section>
        <section>
            <p id="msg"></p>
        </section>
        
    </body>
</html>
